    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);

    color: rgba(255,255,255,.55); font-size: 13px; pointer-events: none; z-index: 10;
    text-align: center; white-space: nowrap;
  }

    position: absolute; top: 70px; right: 20px; width: 330px; max-height: 80vh;
    overflow-y: auto;
    background: rgba(15, 20, 40, .92); border: 1px solid rgba(120,160,255,.35);

    display: none; backdrop-filter: blur(6px);
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
  }
  #info-panel h2 { font-size: 24px; margin-bottom: 4px; color: #ffd966; }
  #info-panel .subtitle { font-size: 13px; color: #9ab; margin-bottom: 14px; font-style: italic; }
  #info-panel table { width: 100%; font-size: 13px; border-collapse: collapse; }
  #info-panel td { padding: 4px 0; vertical-align: top; }
  #info-panel td:first-child { color: #8fa8d0; width: 44%; padding-right: 8px; }
  #info-panel .fact {
    margin-top: 14px; padding: 10px; background: rgba(120,160,255,.12);
    border-left: 3px solid #6c8cff; border-radius: 4px; font-size: 13px; line-height: 1.5;
  }
  #close-btn {
    position: absolute; top: 10px; right: 12px; background: none; border: none;
    color: #aaa; font-size: 20px; cursor: pointer;
  }
  #close-btn:hover { color: #fff; }

  #controls {
    position: absolute; top: 70px; left: 20px; z-index: 20;
    background: rgba(15, 20, 40, .85); border: 1px solid rgba(120,160,255,.25);
    border-radius: 12px; padding: 14px 16px; color: #ddd; font-size: 13px;
    backdrop-filter: blur(6px);
  }
  #controls label { display: block; margin-bottom: 6px; color: #8fa8d0; }
  #controls input[type=range] { width: 170px; }
  #controls button {
    margin-top: 10px; width: 100%; padding: 7px; border: 1px solid rgba(120,160,255,.4);
    background: rgba(108,140,255,.18); color: #cdf; border-radius: 6px; cursor: pointer;
    font-size: 13px;
  }
  #controls button:hover { background: rgba(108,140,255,.35); }
  #speed-value { color: #fff; }

  #tooltip {
    position: absolute; padding: 4px 10px; background: rgba(0,0,0,.8);
    color: #fff; font-size: 13px; border-radius: 6px; pointer-events: none;
    display: none; z-index: 30; border: 1px solid rgba(255,255,255,.2);
  }

<div id="controls">

// ---------- Sternenhimmel ----------
(function makeStars() {
  const geo = new THREE.BufferGeometry();
  const n = 4000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    // gleichmäßig auf einer großen Kugelschale verteilen
    const r = 900 + Math.random() * 600;
    const theta = Math.acos(2 * Math.random() - 1);
    const phi = Math.random() * Math.PI * 2;
    pos[i*3]   = r * Math.sin(theta) * Math.cos(phi);
    pos[i*3+1] = r * Math.cos(theta);
    pos[i*3+2] = r * Math.sin(theta) * Math.sin(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.4, sizeAttenuation: true });
  scene.add(new THREE.Points(geo, mat));
})();

// ---------- Himmelskörper erzeugen ----------
// Aufbau pro Planet:
//   pivot (dreht sich = Umlauf um die Sonne)
//     └─ anchor (sitzt auf der Bahn, dreht sich NICHT mit der Planetenrotation)
//          ├─ Planetenkugel (rotiert um die eigene Achse)
//          ├─ Saturnringe (feste Neigung, unabhängig von der Rotation)
//          └─ Mond-Pivots (drehen sich = Umlauf der Monde)
const clickableMeshes = [];
const planetSystems = [];   // { pivot, mesh, body }
const moonPivots = [];      // { pivot, periodDays }

function makeOrbitLine(radius, opacity) {
  const pts = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  return new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x4a5a8a, transparent: true, opacity })
  );
}

  const geo = new THREE.SphereGeometry(body.radius, 48, 48);
  const mat = body.emissive
    ? new THREE.MeshBasicMaterial({ color: body.color })
    : new THREE.MeshStandardMaterial({ color: body.color, roughness: 0.85, metalness: 0.05 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.body = body;
  clickableMeshes.push(mesh);

  let anchor;
  if (body.distance === 0) {
    // Sonne mit Glow-Sprite
    scene.add(mesh);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeGlowTexture(), color: 0xffcc66, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    glow.scale.set(body.radius * 5.5, body.radius * 5.5, 1);
    mesh.add(glow);
    planetSystems.push({ pivot: null, mesh, body });
  } else {
    const pivot = new THREE.Object3D();
    pivot.rotation.y = Math.random() * Math.PI * 2; // zufällige Startposition
    scene.add(pivot);

    anchor = new THREE.Group();
    anchor.position.x = body.distance;
    pivot.add(anchor);
    anchor.add(mesh);

    planetSystems.push({ pivot, mesh, body });
    scene.add(makeOrbitLine(body.distance, 0.45));
  }

  // Saturnringe – am Anker, damit sie nicht mit der Planetenrotation mitdrehen
  if (body.hasRings) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(body.radius * 1.4, body.radius * 2.3, 64),
      new THREE.MeshBasicMaterial({
        color: 0xcdb88f, side: THREE.DoubleSide, transparent: true, opacity: 0.65
      })
    );
    ring.rotation.x = Math.PI / 2.4;
    anchor.add(ring);
  }

  // Monde
  if (body.moons) {
    body.moons.forEach(m => {
      const moonBody = {
        name: m.name,
        type: `Mond des Planeten ${body.name}`,
        data: m.data,
        fact: m.fact
      };

      const moonPivot = new THREE.Object3D();
      moonPivot.rotation.y = Math.random() * Math.PI * 2;
      anchor.add(moonPivot);
      moonPivots.push({ pivot: moonPivot, periodDays: m.periodDays });

      const moonMesh = new THREE.Mesh(
        new THREE.SphereGeometry(m.radius, 24, 24),
        new THREE.MeshStandardMaterial({ color: m.color, roughness: 0.95 })
      );
      moonMesh.position.x = m.dist;
      moonMesh.userData.body = moonBody;
      moonPivot.add(moonMesh);
      clickableMeshes.push(moonMesh);

      // unsichtbare, größere Trefferfläche, damit kleine Monde gut klickbar sind
      if (m.radius < 0.5) {
        const hit = new THREE.Mesh(
          new THREE.SphereGeometry(0.7, 12, 12),
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
        );
        hit.userData.body = moonBody;
        moonMesh.add(hit);
        clickableMeshes.push(hit);
      }

      anchor.add(makeOrbitLine(m.dist, 0.22));
    });
  }
});

function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,230,160,1)');
  g.addColorStop(0.35, 'rgba(255,190,90,0.45)');
  g.addColorStop(1, 'rgba(255,160,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

// ---------- Interaktion: Klick & Hover ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const panel = document.getElementById('info-panel');
const tooltip = document.getElementById('tooltip');
let downPos = null;

renderer.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });

renderer.domElement.addEventListener('pointerup', e => {
  // Nur als Klick werten, wenn die Maus kaum bewegt wurde (kein Drehen der Ansicht)
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
  downPos = null;
  if (moved > 5) return;

  const hit = pick(e);
  if (hit) showInfo(hit.userData.body);
});

renderer.domElement.addEventListener('pointermove', e => {
  const hit = pick(e);
  if (hit) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
    tooltip.textContent = hit.userData.body.name;
    renderer.domElement.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    renderer.domElement.style.cursor = 'default';
  }
});

function pick(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickableMeshes, false);
  return hits.length ? hits[0].object : null;
}

function showInfo(body) {
  document.getElementById('info-name').textContent = body.name;
  document.getElementById('info-type').textContent = body.type;
  const table = document.getElementById('info-table');
  table.innerHTML = '';
  for (const [k, v] of Object.entries(body.data)) {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); td1.textContent = k;
    const td2 = document.createElement('td'); td2.textContent = v;
    tr.append(td1, td2);
    table.appendChild(tr);
  }
  document.getElementById('info-fact').textContent = body.fact;
  panel.style.display = 'block';
}

document.getElementById('close-btn').addEventListener('click', () => {
  panel.style.display = 'none';
});

// ---------- Steuerung ----------
let speed = 1, paused = false;
const slider = document.getElementById('speed-slider');
const speedLabel = document.getElementById('speed-value');
slider.addEventListener('input', () => {
  speed = parseFloat(slider.value);
  speedLabel.textContent = speed.toFixed(2) + '×';
});
document.getElementById('pause-btn').addEventListener('click', e => {
  paused = !paused;
  e.target.textContent = paused ? '▶ Weiter' : '⏸ Pause';
});
document.getElementById('reset-btn').addEventListener('click', () => {
  camera.position.copy(HOME_POS);
  controls.target.set(0, 0, 0);
});

// ---------- Animation ----------
// Zeitbasis: 1 Sekunde Echtzeit ≈ 12 simulierte Tage bei maximaler Geschwindigkeit (1×)
const DAYS_PER_SECOND = 12;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (!paused) {
    const days = dt * DAYS_PER_SECOND * speed;
    planetSystems.forEach(({ pivot, mesh, body }) => {
      if (pivot) pivot.rotation.y += (days / body.orbitDays) * Math.PI * 2;
      if (body.rotationDays) mesh.rotation.y += (days / Math.abs(body.rotationDays)) * Math.PI * 2 * Math.sign(body.rotationDays);
    });
    moonPivots.forEach(({ pivot, periodDays }) => {
      pivot.rotation.y += (days / periodDays) * Math.PI * 2;
    });
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
